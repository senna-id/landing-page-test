<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page Testing</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      max-width: 600px;
      width: 100%;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      color: #0f172a;
      margin-bottom: 16px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      padding: 14px 28px;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Produk Hebat Segera Hadir</h1>
    <p>Kami sedang menyiapkan sesuatu yang luar biasa untuk Anda. Klik tombol di bawah ini untuk menjadi yang pertama mendapatkan info terbaru.</p>
    <a href="#" class="btn">Pelajari Selengkapnya</a>
  </div>

</body>
</html>
