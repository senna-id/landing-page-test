<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Blog & Berita - PT Selaras Dinamika Niaga</title>
  <meta name="description" content="Artikel, wawasan, dan berita terbaru seputar solusi pencahayaan LED dan komponen listrik dari SENNA.">

  <!-- Favicons -->
  <link href="assets/img/logo/favicon.webp" rel="icon">
  <link href="assets/img/logo/favicon.webp" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="assets/css/main.css" rel="stylesheet">
  <link href="assets/css/theme.css" rel="stylesheet">

  <!-- Markdown Parser & Frontmatter Library -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml/dist/js-yaml.min.js"></script>
</head>

<body class="blog-page">

  <!-- Header Otomatis Dimuat -->
  <div id="header-container"></div>

  <main class="main">

	<!-- Page Title / Breadcrumb -->
    <div class="page-title text-center">
      <div class="container">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb justify-content-start mb-2" style="background: transparent;">
            <li class="breadcrumb-item"><a href="index.html" class="text-white text-decoration-none">Beranda</a></li>
            <!-- <li class="breadcrumb-item"><a href="produk.html" class="text-white text-decoration-none">Produk</a></li> -->
            <li class="breadcrumb-item active text-warning" aria-current="page">Artikel</li>
          </ol>
        </nav>
        <h1 class="display-5 fw-bold mb-2">Artikel & Wawasan</h1>
        <p class="lead text-white mb-0">Informasi terbaru, panduan, dan tren pencahayaan LED serta kelistrikan industri.</p>
      </div>
    </div>

    <!-- Blog Section -->
    <section id="blog-posts" class="blog-posts section">
      <div class="container">
        <div class="row gy-4" id="blog-list-container">
          <!-- Artikel akan dimuat secara otomatis oleh JavaScript di sini -->
          <div class="text-center py-5">
            <div class="spinner-border text-warning" role="status">
              <span class="visually-hidden">Memuat artikel...</span>
            </div>
            <p class="mt-2 text-muted">Memuat artikel blog...</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer Otomatis Dimuat -->
  <div id="footer-container"></div>
  <div id="cart-container"></div>

  <!-- Scroll Top -->
  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>

  <!-- Main & Core JS -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/senna-core.js"></script>

  <!-- Script Pembaca File Markdown Decap CMS -->
  <script>
    // MASUKKAN USERNAME DAN REPOSITORY GITHUB ANDA DI SINI
    const GITHUB_USER = "senna-id";
    const GITHUB_REPO = "landing-page-test";
    const BRANCH = "main"; // Sesuaikan dengan branch Anda (main / master)

    async function loadBlogPosts() {
      const container = document.getElementById('blog-list-container');
      
      try {
        // Ambil daftar file dari folder 'blog' di GitHub API
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/blog?ref=${BRANCH}`);
        
        if (!response.ok) {
          throw new Error('Belum ada artikel yang diterbitkan.');
        }

        const files = await response.json();
        const mdFiles = files.filter(file => file.name.endsWith('.md'));

        if (mdFiles.length === 0) {
          container.innerHTML = '<div class="col-12 text-center py-5"><p>Belum ada artikel blog.</p></div>';
          return;
        }

        let postsHTML = '';

        for (const file of mdFiles) {
          const res = await fetch(file.download_url);
          const text = await res.text();

          // Parsing YAML Frontmatter di bagian atas file .md
          const parts = text.split('---');
          if (parts.length >= 3) {
            const frontmatter = jsyaml.load(parts[1]);
            const bodyContent = parts.slice(2).join('---');

            const title = frontmatter.title || 'Tanpa Judul';
            const date = frontmatter.date ? new Date(frontmatter.date).toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
            const description = frontmatter.description || '';
            const image = frontmatter.image || 'assets/img/blog/default.jpg';

            postsHTML += `
              <div class="col-lg-4 col-md-6" data-aos="fade-up">
                <article class="card h-100 shadow-sm border-0 overflow-hidden">
                  <img src="${image}" class="card-img-top" alt="${title}" style="height: 200px; object-fit: cover;" onerror="this.src='assets/img/logo/favicon.webp'">
                  <div class="card-body d-flex flex-column p-4">
                    <div class="text-muted small mb-2"><i class="bi bi-calendar3 me-1"></i> ${date}</div>
                    <h5 class="card-title fw-bold mb-3">${title}</h5>
                    <p class="card-text text-secondary mb-4 flex-grow-1">${description}</p>
                    <a href="blog-detail.html?file=${encodeURIComponent(file.name)}" class="btn btn-outline-warning text-dark mt-auto align-self-start fw-semibold">Baca Selengkapnya <i class="bi bi-arrow-right"></i></a>
                  </div>
                </article>
              </div>
            `;
          }
        }

        container.innerHTML = postsHTML;

      } catch (error) {
        container.innerHTML = `<div class="col-12 text-center py-5"><p class="text-muted">${error.message}</p></div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadBlogPosts);
  </script>

</body>
</html>
